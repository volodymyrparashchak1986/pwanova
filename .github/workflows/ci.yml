name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Runs the real migrations + seed on an in-process Postgres (PGlite) and checks RLS / business rules.
      - run: npm test
      # No env vars on purpose: production build must succeed without inventing demo/backend data.
      - run: npm run build

  # Production deploy to Vercel after CI passes on main. Disabled until the repository variable
  # VERCEL_DEPLOY is "true" and the VERCEL_TOKEN secret exists (see README > Deploy to Vercel).
  deploy:
    needs: validate
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.VERCEL_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Vercel builds remotely with the project's environment variables; nothing sensitive is needed here.
      - run: npx --yes vercel@59.23.2 deploy --prod --yes
